<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dicee 🎲</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Lobster&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <h1 id="resultTitle">Let's Roll!</h1>

      <div class="dice-area">
        <div class="dice">
          <p>Player 1</p>
          <img class="img1" src="images/dice6.png" alt="Dice 1" />
        </div>
        <div class="dice">
          <p>Player 2</p>
          <img class="img2" src="images/dice6.png" alt="Dice 2" />
        </div>
      </div>

      <button id="rollButton" class="roll-btn">🎲 ROLL!</button>
    </div>

    <footer>© 2025 Dice Game</footer>

    <script src="index.js"></script>
  </body>
</html>
